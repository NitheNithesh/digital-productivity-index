
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Productivity Index Survey</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: Arial, sans-serif;
      background: #f8fafc;
    }

    
    .survey-frame {
      display: block;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      border: 0;
      background: white;
    }
    
    /* Branding overlay — test carefully on mobile */
    .survey-wrapper {
      position: relative;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
    }
    
    .branding-cover {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 48px;
      background: #f8fafc;
      z-index: 10;
    }   
  </style>
</head>
<body>
  
  <div class="survey-wrapper">
    <iframe
      class="survey-frame"
      src="https://digital-appuctivity-index-fdumfvsbh8rmcvyjpnqqln.streamlit.app/?embed=true"
      title="Digital Productivity Index Survey"
      allow="clipboard-write"
    ></iframe>
    <div class="branding-cover"></div>
  </div>

</body>
</html>
